<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E6B67">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Call Log">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Call Log</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0E6B67;
      color: #fff;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    main {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      display: block;
      margin: 0 auto 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .status {
      margin: 0 0 28px;
      font-size: 1.05rem;
      line-height: 1.45;
      color: rgba(255,255,255,.88);
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px 20px;
      border-radius: 14px;
      background: #F5B840;
      color: #0E6B67;
      font-size: 1.2rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(0,0,0,.2);
    }
    .btn:active { transform: scale(0.98); }
    .hint {
      margin: 22px 0 0;
      font-size: 0.9rem;
      line-height: 1.45;
      color: rgba(255,255,255,.78);
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="./icon-192.png" alt="Call Log">
    <h1>Call Log</h1>
    <p class="status" id="status">Opening your private call log…</p>
    <a class="btn" id="open" href="https://cursor.com/canvas/store-8010b9c9-69af-4646-baf7-c100e3e46d55/be6a8d30-df59-4543-b2e5-3c16b28c43ac">Open Call Log</a>
    <p class="hint" id="hint">On Chrome, tap the menu, then Install app or Add to Home screen to keep this icon on your phone.</p>
  </main>
  <script>
    const TARGET = "https://cursor.com/canvas/store-8010b9c9-69af-4646-baf7-c100e3e46d55/be6a8d30-df59-4543-b2e5-3c16b28c43ac";
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
    const standalone =
      window.matchMedia("(display-mode: standalone)").matches ||
      window.matchMedia("(display-mode: fullscreen)").matches ||
      window.navigator.standalone === true;
    if (standalone) {
      location.replace(TARGET);
    } else {
      // Give Chrome a moment to offer Install app, then go to the call log.
      document.getElementById("status").textContent =
        "This page can be installed as its own app. Opening your call log in a few seconds…";
      setTimeout(function () {
        location.replace(TARGET);
      }, 6000);
    }
  </script>
</body>
</html>
